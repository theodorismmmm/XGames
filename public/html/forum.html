<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forum - GameSpaces</title>
    <meta name="title" content="GameSpaces - Forum" />
    <meta name="author" content="GameSpaces" />
    <link
      rel="icon"
      href="../media/logo.svg"
      type="image/x-icon"
      id="favicon"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <link
      rel="stylesheet"
      href="https://site-assets.fontawesome.com/releases/v6.5.2/css/all.css"
    />
    <link rel="stylesheet" type="text/css" href="../css/toastify.min.css" />
    <script src="../js/cloak.js"></script>
  </head>
  <body>
    <div class="navbar-container"></div>
    <div id="blobs">
      <div class="gradiant"></div>
      <div class="gradiant2"></div>
      <div class="gradiant3"></div>
    </div>
    <div id="particles-js"></div>
    <div class="container" style="min-height: 80vh">
      <main
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 2rem;
        "
      >
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
          "
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="80"
            height="80"
            fill="none"
            viewBox="0 0 24 24"
            stroke="var(--primary-color)"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8v4m0 4h.01M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"
            />
          </svg>
          <h1 style="font-size: 2.2rem; font-weight: 800">Forum nicht verfügbar</h1>
          <p style="font-size: 1.15rem; color: var(--text-color); opacity: 0.8">
            Das Forum ist derzeit nicht verfügbar.
          </p>
        </div>
        <div style="display: flex; gap: 5px">
          <a href="/" class="btn" style="margin-top: 1rem; min-width: 120px"
            >Zur Startseite</a
          >
        </div>
      </main>
    </div>
    <div class="footer">
      <a
        href="https://github.com/theodorismmmm/XGames"
        class="link"
        >GitHub</a
      >
    </div>

    <script src="../js/nav.js"></script>
    <script src="../js/main.js"></script>
    <script type="text/javascript" src="../js/toastify-js.js"></script>
    <script src="../js/sweetalert2.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <div class="panic-btn-div" id="panicDiv">
      <button id="panicBtn">Panic</button>
    </div>
  </body>
</html>
