<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mehr - GameSpaces</title>
    <meta name="title" content="GameSpaces - Mehr" />
    <meta name="author" content="GameSpaces" />
    <link
      rel="icon"
      href="../media/logo.svg"
      type="image/x-icon"
      id="favicon"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <link
      rel="stylesheet"
      href="https://site-assets.fontawesome.com/releases/v6.5.2/css/all.css"
    />
    <link rel="stylesheet" type="text/css" href="../css/toastify.min.css" />
    <script src="../js/cloak.js"></script>

    <style>
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.8;
        }
      }

      .section-card {
        background: var(--bg-2-color);
        border: 2px solid var(--border-color);
        border-radius: var(--border-radius);
        padding: 50px 40px;
        margin-bottom: 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        transition:
          transform 0.2s,
          border-color 0.2s;
      }

      .section-card:hover {
        transform: translateY(-5px);
        border-color: var(--primary-color);
      }

      .section-header {
        text-align: center;
        margin-bottom: 35px;
      }

      .section-icon {
        font-size: 64px;
        color: var(--primary-color);
        margin-bottom: 15px;
      }

      .section-icon.pulse {
        animation: pulse 2s infinite;
      }

      .section-title {
        color: var(--primary-color);
        margin: 0 0 15px 0;
        font-size: 2rem;
        font-weight: 700;
      }

      .section-subtitle {
        font-size: 1rem;
        color: var(--text-color);
        opacity: 0.7;
        max-width: 600px;
        margin: 0 auto;
      }

      .partners-grid {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
      }

      .partner-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 140px;
        height: 140px;
        background-color: color-mix(in srgb, var(--bg-2-color) 80%, white 5%);
        border: 2px solid var(--border-color);
        border-radius: var(--border-radius);
        text-align: center;
        color: var(--text-color);
        transition: all 0.2s;
        text-decoration: none;
        padding: 20px;
        cursor: pointer;
      }

      .partner-card:hover {
        transform: scale(1.05);
        border-color: var(--primary-color);
      }

      .partner-card img {
        width: 60px;
        height: 60px;
        margin-bottom: 10px;
        border-radius: 50%;
        object-fit: cover;
      }

      .partner-card .fa-brands,
      .partner-card .fa-solid {
        font-size: 48px;
        margin-bottom: 10px;
        color: var(--primary-color);
      }

      .card-label {
        font-size: 1rem;
        font-weight: 600;
        word-wrap: break-word;
      }

      .action-buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
        margin-top: 25px;
      }

      .btn-with-icon {
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
      }

      @media (max-width: 600px) {
        .section-card {
          padding: 30px 20px;
        }

        .section-icon {
          font-size: 48px;
        }

        .section-title {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="navbar-container"></div>
    <div id="blobs">
      <div class="gradiant"></div>
      <div class="gradiant2"></div>
      <div class="gradiant3"></div>
    </div>
    <div id="particles-js"></div>

    <main>
      <i
        class="fa-solid fa-plus"
        style="font-size: 38px; color: var(--primary-color)"
      ></i>
      <h1>Mehr</h1>
      <div class="centered-container" style="max-width: 900px">
        <div class="section-card">
          <div class="section-header">
            <i class="fa-solid fa-gavel section-icon"></i>
            <h2 class="section-title">DMCA-Hinweis</h2>
            <p class="section-subtitle">
              Falls du glaubst, dass deine Inhalte ohne Erlaubnis verwendet werden,
              kontaktiere uns bitte.<br />
              Hinweis: Spiele werden nicht auf dieser Seite gehostet.
            </p>
          </div>

          <div style="text-align: center">
            <button id="dmca-btn" class="btn">
              <i class="fa-solid fa-envelope"></i> DMCA-Hinweis einreichen
            </button>
          </div>
        </div>
      </div>
    </main>

    <div class="footer">
      <a
        href="https://github.com/theodorismmmm/XGames"
        class="link"
        >GitHub</a
      >
    </div>

    <script type="text/javascript" src="../js/toastify-js.js"></script>
    <script src="../js/sweetalert2.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/more.js"></script>
    <script>
      document.getElementById("dmca-btn").addEventListener("click", () => {
        Swal.fire({
          title: "DMCA-Hinweis",
          html: '<p style="text-align: left; margin-bottom: 15px;">Bitte sende deinen DMCA-Hinweis an:</p><p style="font-weight: 600; color: var(--primary-color);">dmca@gamespaces.de</p>',
          icon: "info",
          confirmButtonText: "Verstanden",
          showClass: {
            popup: "swal2-smooth-in",
          },
          hideClass: {
            popup: "swal2-smooth-out",
          },
        });
      });
    </script>
    <script src="../js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <div class="panic-btn-div" id="panicDiv">
      <button id="panicBtn">Panic</button>
    </div>
  </body>
</html>
