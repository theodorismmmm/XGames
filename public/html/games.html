<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spiele - GameSpaces</title>
    <meta name="title" content="GameSpaces - Kostenlose Online-Spiele" />
    <meta
      name="description"
      content="GameSpaces - Spiele hunderte von kostenlosen Online-Spielen direkt im Browser."
    />
    <meta
      name="keywords"
      content="online spiele, kostenlose spiele, browser spiele, spieleplattform"
    />
    <meta name="author" content="GameSpaces" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="German" />
    <meta name="revisit-after" content="7 days" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GameSpaces - Kostenlose Online-Spiele" />
    <meta
      property="og:description"
      content="Spiele hunderte von kostenlosen Online-Spielen direkt im Browser."
    />
    <meta property="og:image" content="/media/logo.svg" />
    <meta property="og:site_name" content="GameSpaces" />
    <link
      rel="icon"
      href="../media/logo.svg"
      type="image/x-icon"
      id="favicon"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <link
      rel="stylesheet"
      href="https://site-assets.fontawesome.com/releases/v6.5.2/css/all.css"
    />
    <link rel="stylesheet" type="text/css" href="../css/toastify.min.css" />
    <script src="../js/cloak.js"></script>
  </head>
  <body>
    <div class="navbar-container"></div>
    <div id="blobs">
      <div class="gradiant"></div>
      <div class="gradiant2"></div>
      <div class="gradiant3"></div>
    </div>
    <div id="particles-js"></div>
    <main>
      <i
        class="fa-solid fa-gamepad"
        style="font-size: 38px; color: var(--primary-color)"
      ></i>
      <h1>Spiele</h1>
      <div class="search-container">
        <i class="fa-solid fa-magnifying-glass" id="search-icon"></i>
        <input
          type="text"
          id="search-input"
          placeholder="Spiele suchen..."
          class="search"
        />
      </div>
      <div class="filters">
        <p>Nach Typ filtern:</p>
        <button class="btn active" id="proxy-btn">
          <i class="fa-solid fa-cloud"></i> Proxy-Spiele
        </button>
        <button class="btn active" id="html5-btn">
          <i class="fa-brands fa-html5"></i> HTML5-Spiele
        </button>
      </div>

      <div id="games-list"></div>
    </main>
    <div class="footer">
      <a
        href="https://github.com/theodorismmmm/XGames"
        class="link"
        >GitHub</a
      >
    </div>
    <style>
      .filters {
        margin-top: 15px;
      }
    </style>
    <script src="../js/games.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/main.js"></script>
    <script src="/sj/register-sw.js" defer></script>
    <script src="/sj/search.js" defer></script>
    <script src="/sj/index.js" defer></script>
    <script src="/scram/scramjet.all.js"></script>
    <script src="/baremux/index.js" defer></script>
    <script src="/uv/uv.bundle.js" defer></script>
    <script src="/uv/uv.config.js" defer></script>
    <script src="/uv/register-sw.js" defer></script>
    <script src="/uv/search.js" defer></script>
    <script src="/uv/proxy.js" defer></script>
    <script type="text/javascript" src="../js/toastify-js.js"></script>
    <script src="../js/sweetalert2.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <div class="panic-btn-div" id="panicDiv">
      <button id="panicBtn">Panic</button>
    </div>
  </body>
</html>
