<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - GameSpaces</title>
    <meta name="title" content="GameSpaces - Seite nicht gefunden" />
    <meta name="author" content="GameSpaces" />
    <link
      rel="icon"
      href="../media/logo.svg"
      type="image/x-icon"
      id="favicon"
    />
    <link rel="stylesheet" href="../../css/theme.css" />
    <link rel="stylesheet" href="../../css/main.css" />
    <link
      rel="stylesheet"
      href="https://site-assets.fontawesome.com/releases/v6.5.2/css/all.css"
    />
    <script src="https://cdn.jsdelivr.net/gh/Parcoil/cloak@main/src/index.js"></script>
  </head>
  <body>
    <div class="navbar-container"></div>
    <div id="blobs">
      <div class="gradiant"></div>
      <div class="gradiant2"></div>
    </div>
    <div class="container" style="min-height: 80vh">
      <main
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 2rem;
        "
      >
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
          "
        >
          <i
            class="fa-solid fa-triangle-exclamation"
            style="font-size: 48px; color: var(--primary-color)"
          ></i>
          <h1 style="font-size: 2.5rem; font-weight: 800">404</h1>

          <p
            style="font-size: 1.25rem; color: var(--text-color); opacity: 0.8"
            id="path"
          >
            Seite nicht gefunden:
          </p>

          <p style="color: var(--text-color); opacity: 0.7">
            Die gesuchte Seite existiert nicht oder wurde verschoben.
          </p>
        </div>
        <a
          href="/"
          id="home-btn"
          class="btn"
          style="margin-top: -0.5rem; min-width: 120px"
        >
          Zur Startseite
        </a>
        <p
          id="iframe-warning"
          style="display: none; color: var(--text-color); opacity: 0.8"
        >
          Diese Seite wird eingebettet angezeigt. Bitte öffne sie direkt.
        </p>
      </main>

      <script>
        const nav = document.getElementsByClassName("navbar-container");
        const blobs = document.getElementById("blobs");

        const path = window.location.pathname;

        document.getElementById("path").textContent += ` ${path}`;

        if (window.self !== window.top) {
          if (nav[0]) nav[0].remove();
          if (blobs) blobs.remove();
          const container = document.querySelector(".container");
          if (container) {
            container.innerHTML = `
        <main style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 80vh;
          text-align: center;
          gap: 1rem;
        ">
          <i class="fa-solid fa-ban" style="font-size: 48px; color: var(--primary-color)"></i>
          <h1 style="font-size: 2rem; font-weight: 700;">Proxy-Fehler</h1>
          <p style="color: var(--text-color); opacity: 0.8;">
            Bitte lade die Seite neu. Falls das Problem anhält, versuche einen anderen Browser.
          </p>
        </main>
      `;
          }
        }
      </script>
    </div>
    <div class="footer">
      <a
        href="https://github.com/theodorismmmm/XGames"
        class="link"
        >GitHub</a
      >
    </div>
    <script src="../js/nav.js"></script>
    <script src="../js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <div class="panic-btn-div" id="panicDiv">
      <button id="panicBtn">Panic</button>
    </div>
  </body>
</html>
